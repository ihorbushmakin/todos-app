{% extends 'tasks/base.html' %}

{% block title %}Edit todo{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Edit Todo</h2>

    <form method="post" class="needs-validation" novalidate>
        {% csrf_token %}
        <div class="mb-3">
            <label for="title" class="form-label">Title:</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ task.title }}" required>
            <div class="invalid-feedback">
                Please provide a title.
            </div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description:</label>
            <textarea class="form-control" id="description" name="description" rows="4" required>{{ task.description }}</textarea>
            <div class="invalid-feedback">
                Please provide a description.
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="{% url 'task-list' %}" class="btn btn-secondary ms-2">Back to todos</a>
    </form>
</div>
{% endblock %}
